# پیکربندی مستقل برای AvidKiya Deployer
# این یک Worker جداگانه است — روی حساب Cloudflare خودتان (نه پروژه Pages اصلی) دیپلویش کنید.
#
# نصب:
#   cd workers/deployer
#   npx wrangler deploy
#
# بعد از دیپلوی، آدرس worker.dev داده‌شده را باز کنید و توکن Cloudflare خود را وارد کنید.

name = "avidkiya-deployer"
main = "worker.js"
compatibility_date = "2024-12-01"
