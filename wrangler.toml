name = "avidkiya-platform"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[env.production]
# Cloudflare Pages will build via `npx @cloudflare/next-on-pages`

[[d1_databases]]
binding = "KIYA_DB"
database_name = "kiya-planner"
database_id = "REPLACE_ME"

[[kv_namespaces]]
binding = "CMS_KV"
id = "REPLACE_ME"

[[r2_buckets]]
binding = "FILES_R2"
bucket_name = "avidkiya-files"

[vars]
NEXT_PUBLIC_SITE_URL = "https://avidkiya.com"
NEXT_PUBLIC_GITHUB_USERNAME = "avidkiya"
