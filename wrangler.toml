# Cloudflare Pages + Workers config
name = "avidkiya-platform"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

[vars]
NEXT_PUBLIC_SITE_URL = "https://avidkiya.com"
NEXT_PUBLIC_GITHUB_USERNAME = "avidkiya"

# اگر از OpenNext استفاده می‌کنید:
# main = ".open-next/worker.js"

# D1 / KV / R2 bindings
# ⚠️ این بخش فعلاً کامنت است چون هیچ API route ای در کد از این بایندینگ‌ها استفاده نمی‌کند
# (همه به صورت in-memory / localStorage کار می‌کنند). وقتی به دیتابیس واقعی نیاز پیدا کردید:
#   ۱. یک KV Namespace واقعی بسازید:
#      Cloudflare Dashboard → Workers & Pages → KV → Create a namespace
#   ۲. یک D1 Database واقعی بسازید:
#      Cloudflare Dashboard → Workers & Pages → D1 → Create database
#   ۳. کامنت‌های زیر را بردارید و database_id / id را با مقادیر واقعی جایگزین کنید
#      (یا از طریق Pages → Settings → Bindings مستقیماً از داشبورد وصل کنید)
#
# [[d1_databases]]
# binding = "DB"
# database_name = "kiya-planner-db"
# database_id = "YOUR_D1_DATABASE_ID"
#
# [[kv_namespaces]]
# binding = "KV"
# id = "YOUR_KV_NAMESPACE_ID"

# [[r2_buckets]]
# binding = "FILES_R2"
# bucket_name = "avidkiya-files"
